name: ci

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned by full commit SHA (not a floating @v4 tag) so a
# compromised or retagged action release cannot silently enter CI (finding #7).
# The trailing comment records the human-readable version each SHA resolves to.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Vitest transpiles without typechecking, so a red build can hide
      # behind green tests — the typecheck gate closes that gap.
      - run: npm run typecheck
      # The canonicalization test now generates the demo receipt chain in memory,
      # so it is hermetic and no `npm run demo` pre-step is needed here.
      - run: npm test
      # Clean-pack smoke test: pack exactly as published, install the tarball in
      # an isolated consumer, import the ESM entrypoint, and assert dist/testing
      # is not shipped (finding #7).
      - run: npm run smoke:package
