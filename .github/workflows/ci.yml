name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Vitest transpiles without typechecking, so a red build can hide
      # behind green tests — the typecheck gate closes that gap.
      - run: npm run typecheck
      # Generate the demo receipt log the canonicalization test reads. It is a
      # gitignored build artifact (untracked in e67fb4e), so a clean CI checkout
      # lacks it; regenerate it here rather than committing a generated file.
      - run: npm run demo
      - run: npm test
