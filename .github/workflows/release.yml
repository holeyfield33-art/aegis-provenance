name: release

# Provenance-producing publication workflow (findings #6/#7). Publishing through
# this workflow — rather than a manual `npm publish` from a laptop — is what
# lets npm attach GitHub Actions trusted-publisher provenance to the package,
# and it enforces that the npm package, git tag and GitHub Release all identify
# the same commit and version.
#
# Two entry points, with different powers:
#   - push a `vX.Y.Z` tag  -> full release: gate, verify tag == package version,
#     publish with provenance.
#   - workflow_dispatch     -> DRY RUN ONLY: runs the gate and builds/packs, but
#     never publishes. Manual runs cannot publish, so they cannot publish from an
#     arbitrary branch with a mismatched version.
#
# Requires (one-time repo setup, see RELEASING.md): an npm trusted publisher
# configured for this repo + workflow. There is deliberately NO token fallback —
# if trusted publishing is not configured, the publish step fails loudly rather
# than silently switching to a long-lived token.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release from the tag
  id-token: write # required for npm provenance / trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run benchmark
      - run: npm run benchmark:differential:gate
      - run: npm run build
      - run: npm run smoke:package

      # On a tag push, the git tag and the package.json version MUST match, or we
      # would publish a version that does not correspond to the tagged commit
      # (finding #6). Fail hard on any mismatch.
      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          echo "package.json version: $PKG_VERSION"
          echo "git tag:              $TAG"
          if [ "$TAG" != "v$PKG_VERSION" ]; then
            echo "::error::Tag '$TAG' does not match package version 'v$PKG_VERSION'." >&2
            exit 1
          fi

      # Publish ONLY on a tag push, and only via trusted publishing (OIDC). A
      # workflow_dispatch run reaches here with ref_type != 'tag' and skips
      # publication entirely — it is a dry run.
      - name: Publish to npm with provenance
        if: github.ref_type == 'tag'
        run: npm publish --provenance --access public

      # Create the GitHub Release from the SAME tag, so npm, the git tag and the
      # GitHub Release all identify the same commit (finding #6). --verify-tag
      # ensures the tag exists on this commit; the CHANGELOG section for this
      # version is used as the release notes when present.
      - name: Create GitHub Release from tag
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it as-is."
          else
            NOTES_FILE="$(mktemp)"
            # Extract this version's CHANGELOG section for the notes, if present.
            awk -v ver="${TAG#v}" '
              $0 ~ "^## \\[" ver "\\]" {capture=1; next}
              capture && /^## \[/ {exit}
              capture {print}
            ' CHANGELOG.md > "$NOTES_FILE" || true
            if [ ! -s "$NOTES_FILE" ]; then
              echo "Release $TAG" > "$NOTES_FILE"
            fi
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$NOTES_FILE"
          fi

      - name: Dry run summary
        if: github.ref_type != 'tag'
        run: echo "Dry run complete (gate + build + smoke passed). Publication happens only on a vX.Y.Z tag push."
